    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#06091d" flood-opacity=".26"/>
    </filter>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.5" fill="#ffffff" opacity=".13"/>
      <circle cx="28" cy="25" r="2.5" fill="#ffffff" opacity=".1"/>
    </pattern>
    <style>
      .headline { font-family: "Arial Black", Impact, Arial, sans-serif; font-weight: 900; letter-spacing: 0; }
      .body { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 0; }
      .small { font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 0; }
      .web { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; opacity: .82; }
      .web-dark { fill: none; stroke: #160814; stroke-width: 6; stroke-linecap: round; opacity: .72; }
      .comic { fill: #ffe45c; stroke: #10122c; stroke-width: 10; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#burst)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>

