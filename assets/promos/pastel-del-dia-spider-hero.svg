<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Promocion pastel del dia Pasteleria Alicia</title>
  <desc id="desc">Anuncio promocional para un pastel infantil de fondant inspirado en un superheroe aracnido, con texto de contacto de Pasteleria Alicia.</desc>
  <defs>
    <radialGradient id="burst" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="34%" stop-color="#f85d4d"/>
      <stop offset="68%" stop-color="#173fb4"/>
      <stop offset="100%" stop-color="#09133f"/>
    </radialGradient>
    <linearGradient id="cakeRed" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4a43"/>
      <stop offset="48%" stop-color="#d9152c"/>
      <stop offset="100%" stop-color="#8b0619"/>
    </linearGradient>
    <linearGradient id="blueFondant" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#36c4ff"/>
      <stop offset="58%" stop-color="#1267d8"/>
      <stop offset="100%" stop-color="#09347f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" x2="100%" y1="0%" y2="100%">
