      - name: 🧹 Clean up API key
        run: rm ios/AuthKey.p8 || true
      - name: 🏷️ Tag the release
        run: |
          git config --global user.name "Sebastian Vasquez"
          git config --global user.email "sebastian@blueskyai.co"
          git fetch --prune --unshallow

          git tag "v${{ github.event.inputs.release_version }}-${{env.ENVIRONMENT}}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} --tags
      - name: 📰 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.event.inputs.release_version }}-${{env.ENVIRONMENT}}"
          generate_release_notes: true
      - name: 🧾 Upload Xcode build logs if build fails
        if: failure()
