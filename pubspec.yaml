name: alice
description: "Alice mobile, app model for small popular companies."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  app_links: 6.4.0
  flutter_bloc: 9.1.1
  cloud_firestore: 5.6.12
  connectivity_plus: 6.1.3
  collection: 1.19.1
  cupertino_icons: 1.0.2
  expandable: 5.0.1
  equatable: 2.0.8
  ffi: 2.1.3 
  firebase_auth: 5.7.0
  firebase_core: 3.15.2
  firebase_storage: 12.4.10
  file_picker: 9.2.3
  flutter_markdown_selectionarea: 0.6.17+1
  flutter_launcher_icons: 0.14.4
  flutter_lints: 5.0.0
  flutter_svg: 2.2.2
  flutter_spinkit: 5.1.0
  flutter_native_splash: 2.4.6
  flutter_dotenv: 5.2.1
  grouped_list: 6.0.0
  gradient_borders: 1.0.1
  graphql_flutter: 5.2.1
  google_sign_in: 6.3.0
  google_fonts: 6.3.3
  go_router: 17.0.1
  http: 1.4.0
  intl: 0.20.2
  logger: 2.6.2
  markdown: 7.3.0
  path: 1.9.1
  path_provider: 2.1.4
  package_info_plus: 8.3.0 
  permission_handler: 11.3.1
  share_plus: 10.1.4
  the_apple_sign_in: 1.1.1
  url_launcher: 6.3.2
  uuid: 4.4.2
  wolt_modal_sheet: 0.11.0

dev_dependencies:
  build_runner: 2.5.4
  graphql_codegen: 1.2.4

flutter:
  uses-material-design: true
  assets:
    ##envs
    - .env
    - .env.example
    ##icons
    - assets/icons/google-icon.svg
    - assets/icons/apple-icon.svg
    - assets/icons/location-icon.svg
    - assets/icons/chat-balloon.svg
    - assets/icons/speaker-icon.svg
    - assets/icons/arrow-back-archive-icon.svg
    - assets/icons/gear-icon.svg
    - assets/icons/trash-icon.svg
    - assets/icons/edit-icon.svg
    - assets/icons/bars-icon.svg
    - assets/icons/address-icon.svg
    - assets/icons/archive-icon.svg
    - assets/icons/email-icon.svg
    - assets/icons/globe-icon.svg
    - assets/icons/info-icon.svg
    - assets/icons/question-icon.svg
    - assets/icons/privacy-icon.svg
    - assets/icons/sign-out-icon.svg
    - assets/icons/copy-text-icon.svg
    - assets/icons/share-icon.svg
    - assets/icons/newchat-icon.svg
    - assets/icons/send-icon.svg
    - assets/icons/copy-message-icon.svg
    - assets/icons/thumb-down-icon.svg
    - assets/icons/thumb-up-icon.svg
    - assets/icons/experiment-icon.svg
    - assets/icons/url-icon.svg
    - assets/icons/unarchive-icon.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/alice_app_icon.png"
  adaptive_icon_foreground: "assets/alice_app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  image_path_ios: "assets/alice_app_icon.png"
  
flutter_native_splash:
  android: true
  ios: true
  web: false

  # for Android < 12 & IOS
  color: "#ffffff"
  image: assets/ios/splash_icon.png

  # for Android >= 12
  android_12:
    color: "#ffffff"
    image: assets/android/splash_icon.png
